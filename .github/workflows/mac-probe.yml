name: Mac probe (temporary)
on:
  push:
    paths:
      - ".github/workflows/mac-probe.yml"
      - "scripts/probe/**"
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          git checkout -q -b mac-check
          CAIRN_REPO="$GITHUB_WORKSPACE" CAIRN_BRANCH=mac-check CAIRN_NO_OPEN=1 bash docs/mac-install.sh > /dev/null
          clang -arch arm64 -arch x86_64 -mmacosx-version-min=11.0 -O2 -o "$RUNNER_TEMP/launcher" mac/launcher.c
          codesign -dv "$RUNNER_TEMP/launcher" 2>&1 | head -3 || true
      - name: Baseline
        run: scripts/probe/count.sh baseline
      - name: "E6: a plain icon from an app whose program is a shell script, signed ad hoc"
        run: |
          app="$RUNNER_TEMP/ProbeSigned.app"
          mkdir -p "$app/Contents/MacOS"
          sed -e 's/io.github.juw12.cairn/io.github.juw12.probesigned/' -e 's/>Cairn</>ProbeSigned</g' "$HOME/Applications/Cairn.app/Contents/Info.plist" > "$app/Contents/Info.plist"
          printf '#!/bin/bash\nexec "%s" "%s"\n' "$HOME/Library/Application Support/Cairn/venv/bin/python" "$GITHUB_WORKSPACE/scripts/probe/plain.py" > "$app/Contents/MacOS/ProbeSigned"
          chmod +x "$app/Contents/MacOS/ProbeSigned"
          codesign --force --deep -s - "$app" && codesign -dv "$app" 2>&1 | head -3
          open -g "$app"
          scripts/probe/count.sh script-signed
          sleep 8
      - name: "E7: a plain icon from an app whose program runs Python inside itself"
        run: |
          app="$RUNNER_TEMP/ProbeInside.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          sed -e 's/io.github.juw12.cairn/io.github.juw12.probeinside/' -e 's/>Cairn</>ProbeInside</g' "$HOME/Applications/Cairn.app/Contents/Info.plist" > "$app/Contents/Info.plist"
          cp "$RUNNER_TEMP/launcher" "$app/Contents/MacOS/ProbeInside"
          root="$HOME/Library/Application Support/Cairn"
          printf '%s\n%s\n%s\n' "$(ls "$root"/python/cpython-3.13-macos-*/lib/libpython3.13.dylib | head -1)" "$root/venv/bin/python" "$GITHUB_WORKSPACE/scripts/probe/plain.py" > "$app/Contents/Resources/cairn-paths.txt"
          cat "$app/Contents/Resources/cairn-paths.txt"
          open -g "$app"
          scripts/probe/count.sh inside-unsigned
          sleep 8
      - name: "E8: the same, with the whole app signed ad hoc"
        run: |
          app="$RUNNER_TEMP/ProbeInside.app"
          codesign --force --deep -s - "$app" && codesign -dv "$app" 2>&1 | head -3
          open -g "$app"
          scripts/probe/count.sh inside-signed
          sleep 8
