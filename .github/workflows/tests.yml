name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install browser for parity + e2e tests
        timeout-minutes: 6
        run: |
          pip install playwright
          playwright install chromium
          # The runner image already ships Chromium's system libraries; only fall
          # back to apt (slow mirrors) if the browser genuinely cannot start.
          python -c "from playwright.sync_api import sync_playwright as s; p = s().start(); p.chromium.launch().close(); p.stop()" \
            || playwright install-deps chromium
      - name: Run all tests
        env:
          CAIRN_REQUIRE_BROWSER: "1"
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          python -m unittest discover -s tests -v
