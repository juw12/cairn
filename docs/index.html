<script>
  // Apply the theme before first paint to avoid a flash.
  (function () {
    var saved = localStorage.getItem("cairn.theme");
    var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>

<body>
<noscript>
  <div style="max-width: 640px; margin: 15vh auto; padding: 0 20px; font: 16px/1.6 system-ui, sans-serif;">
    <h1>Cairn: a second brain that lives inside your repo</h1>
    <p>Capture ideas, brainstorm, record decisions and move tasks, all as plain Markdown next to your code.
    Works with Obsidian, VS Code and any AI assistant.</p>
    <p>The app needs JavaScript. You can read about it without:
    <a href="https://juw12.github.io/p/cairn/">what Cairn does</a>,
    <a href="https://github.com/juw12/cairn">the code and how to install it</a>,
    <a href="https://juw12.github.io/brain/">a public brain made with it</a>.</p>
  </div>
</noscript>
<div id="welcome" class="welcome" hidden></div>

<div id="app" class="app" hidden>
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand" id="brand"></div>
    <button class="project-chip" id="project-chip" data-action="switch-brain" title="Switch brain">
      <strong id="project-name">project</strong>
      <span id="project-mode">…</span>
    </button>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn ghost icon-only menu-btn" data-action="toggle-nav" aria-label="Open menu" id="menu-btn"></button>
      <form class="capture" id="capture-form" autocomplete="off">
        <label for="capture-input" class="sr-only">Quick capture</label>
        <span id="capture-icon"></span>
        <input id="capture-input" name="capture" placeholder="Capture anything… try “todo: ship v1 #release” or “decision: use SQLite”" enterkeyhint="done">
        <span class="hint" id="capture-hint"><kbd>C</kbd> to focus · <kbd>Enter</kbd> to save</span>
        <span class="capture-type pill" id="capture-type" hidden></span>
      </form>
      <button class="btn" data-action="palette" id="search-btn" aria-label="Search and commands (Ctrl+K)"></button>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<div id="layer"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
