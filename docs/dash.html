<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b1a17">
<title>Dashboards - Cairn</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #f4f1ea; --surface: #fffdf8; --line: #e1dbcf; --ink: #1b1a17; --muted: #6c665d;
    --accent: #d9481f; --good: #2f7d4f; --warn: #a86a00; --bad: #b3261e;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151412; --surface: #1c1b18; --line: #2e2c28; --ink: #efebe3; --muted: #968f83;
      --accent: #f0764d; --good: #6cc48f; --warn: #e2b04a; --bad: #f08a80; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    padding-top: max(8px, env(safe-area-inset-top)); background: var(--surface); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 6px; font-weight: 600; margin-right: 2px; }
  .brand img { width: 22px; height: 22px; }
  nav { display: flex; gap: 4px; overflow-x: auto; flex: 1; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button { flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); font: inherit; font-weight: 500; cursor: pointer; }
  nav button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  nav button .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 6px;
    background: var(--accent); vertical-align: 1px; }
  .icon-btn { flex: none; width: 40px; height: 40px; border-radius: 20px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); font-size: 18px; cursor: pointer; }
  .icon-btn.spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { display: flex; align-items: center; gap: 6px; padding: 5px 12px; font-size: 13px; color: var(--muted);
    background: var(--surface); border-bottom: 1px solid var(--line); min-height: 30px; }
  .status .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
  .status.stale .pulse { background: var(--warn); }
  .status.error .pulse { background: var(--bad); }
  .status .warn { color: var(--warn); }
  main { position: relative; flex: 1; min-height: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  iframe[hidden] { display: none; }
  .message { max-width: 460px; margin: 12vh auto 0; padding: 0 22px; text-align: center; }
  .message h1 { font-size: 21px; margin: 0 0 8px; }
  .message p { color: var(--muted); margin: 0 0 12px; }
  .message code { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; }
  .message a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <a class="brand" href="./" aria-label="Cairn home"><img src="icons/icon.svg" alt=""></a>
  <nav role="tablist" aria-label="Dashboards" data-tabs></nav>
  <button class="icon-btn" type="button" data-refresh title="Check for updates" aria-label="Check for updates">&#x21bb;</button>
</header>
<div class="status" role="status" aria-live="polite" data-status hidden></div>
<main data-main>
  <div class="message" data-message><p>Loading&hellip;</p></div>
</main>
<script type="module" src="dash.js"></script>
</body>
</html>
